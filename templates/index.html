<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KARUN AI Chatbot</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <div class="app">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="logo">

                <div class="logo-icon">
                    🦾
                </div>

                <h2>KARUN AI</h2>

            </div>


            <button
                class="new-chat-btn"
                onclick="resetChat()"
            >
                ＋ New Chat
            </button>


            <div class="sidebar-bottom">

                <div class="model-info">

                    <span class="status-dot"></span>

                    <span>
                        qwen2.5:1.5b
                    </span>

                </div>

                <p>
                    Running locally with Ollama
                </p>

            </div>

        </aside>


        <!-- MAIN CHAT -->

        <main class="chat-container">


            <!-- HEADER -->

            <header class="chat-header">

                <div>

                    <h1>
                        AI Assistant
                    </h1>

                    <p>
                        Your private local chatbot
                    </p>

                </div>


                <div class="header-actions">

                    <button
                        class="icon-btn"
                        title="Clear Chat"
                        onclick="resetChat()"
                    >
                        🗑️
                    </button>

                </div>

            </header>


            <!-- CHAT MESSAGES -->

            <section
                class="messages"
                id="messages"
            >


                <!-- WELCOME MESSAGE -->

                <div class="welcome">

                    <div class="welcome-icon">
                        👾
                    </div>

                    <h2>
                        How can I help you today?
                    </h2>

                    <p>
                        I'm running completely on your computer using Ollama.
                    </p>


                    <div class="suggestions">

                        <button onclick="sendSuggestion(this)">
                            Explain how React works
                        </button>

                        <button onclick="sendSuggestion(this)">
                            Help me debug Python code
                        </button>

                        <button onclick="sendSuggestion(this)">
                            Give me a project idea
                        </button>

                        <button onclick="sendSuggestion(this)">
                            Teach me something interesting
                        </button>

                    </div>

                </div>

            </section>


            <!-- INPUT -->

            <div class="input-area">

                <div class="input-box">

                    <textarea
                        id="messageInput"
                        placeholder="Message your AI..."
                        rows="1"
                    ></textarea>


                    <button
                        id="sendButton"
                        onclick="sendMessage()"
                    >
                        ➤
                    </button>

                </div>


                <p class="footer-text">

                    Local AI • Powered by Ollama • Your conversations stay on your computer

                </p>

            </div>


        </main>

    </div>


    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
